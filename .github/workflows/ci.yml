name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Pint · Larastan · Pest
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ceu_testing
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # pcntl/posix are Horizon's; they exist on Linux but not on the
          # Windows dev machine, which is why composer.lock was built with
          # --ignore-platform-req for them. CI is the check that they resolve.
          extensions: pdo_mysql, redis, gd, intl, zip, bcmath, exif, pcntl, posix
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # CLAUDE.md §4 rule 1 — migrate:fresh --seed must ALWAYS produce a working,
      # demoable app. Asserting it here is what keeps that true for eight months.
      - name: Migrate and seed from scratch
        run: php artisan migrate:fresh --seed --no-interaction
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: ceu_testing
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Pint (formatting)
        run: composer lint:test

      - name: Larastan (level 6)
        run: composer types

      # Serial on purpose. Locally `composer test` runs in parallel against
      # SQLite, which is where the pre-commit wait actually hurts. Here it runs
      # against MySQL, where parallel needs Laravel to create a database per
      # worker — that works, but it has not been exercised on this project, and
      # the job that gates every push is the wrong place to find out.
      # Switch to `composer test` once someone has watched it go green twice.
      - name: Pest
        run: composer test:serial
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: ceu_testing
          DB_USERNAME: root
          DB_PASSWORD: root
          REDIS_HOST: 127.0.0.1

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # CLAUDE.md §9 — the predecessor committed live credentials in .env.
      # This makes that a failed build rather than an incident.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
